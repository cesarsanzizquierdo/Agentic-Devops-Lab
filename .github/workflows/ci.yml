name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  tamano-pr:
    name: Gate de tamano de PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar limite de lineas de diff
        env:
          LIMITE_LINEAS: 400
        run: |
          DIFF_LINES=$(git diff --numstat origin/main...HEAD | awk '{sum += $1 + $2} END {print sum}')
          DIFF_LINES=${DIFF_LINES:-0}
          echo "Lineas de diff en este PR: $DIFF_LINES (Limite maximo: $LIMITE_LINEAS)"
          if [ "$DIFF_LINES" -gt "$LIMITE_LINEAS" ]; then
            echo "ERROR: El PR excede el limite de $LIMITE_LINEAS lineas de diff."
            exit 1
          fi

  conventional-commits:
    name: Validar Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Validar mensaje del commit
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Mensaje del commit a validar: $MSG"
          echo "$MSG" | grep -Eq '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-zA-Z0-9_-]+\))?: .+' || {
            echo "ERROR: El commit no cumple con Conventional Commits (ej. feat: ..., ci: ...)"
            exit 1
          }

  tests:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov fastapi uvicorn httpx

      - name: Ejecutar pytest con cobertura
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v --cov=src/aula --cov-report=term-missing

  imagen-oci:
    name: Build y publicacion de imagen OCI
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Construir imagen OCI multi-stage
        run: |
          IMAGE_NAME="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .

      - name: Login en GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}